name: Gatling API Performance

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  gatling-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Gatling simulation
        run: mvn -B -Dgatling.simulationClass=com.example.gatling.simulations.ConfigDrivenApiSimulation -DconfigFile=src/test/resources/sample-config.yaml gatling:test

      - name: Upload Gatling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-reports
          path: target/gatling
